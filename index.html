<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160b2b">
<title id="pageTitle">Para Mi negra 💜</title>
<style>
:root{--bg:#10091d;--panel:#211337;--panel2:#2b1942;--purple:#b99aff;--pink:#f2c5ff;--text:#fff8ff;--muted:#d2c2e8;--gold:#f3d79a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top,#382052 0%,#180d29 42%,#0d0717 100%);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;color:#fff0ff;opacity:.65;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
main{position:relative;z-index:1;width:min(760px,100%);margin:auto;padding:26px 16px 50px}
.hero{text-align:center;padding:48px 14px 35px}
.moon{font-size:42px;filter:drop-shadow(0 0 15px #d4a7ff)}
.eyebrow{text-transform:uppercase;letter-spacing:4px;color:var(--gold);font:11px Arial,sans-serif;margin:18px 0}
h1{font-size:clamp(38px,9vw,62px);line-height:1.05;margin:12px 0;color:#fff5ff;font-weight:normal;text-shadow:0 0 25px #b98cff55}
.hero p{max-width:500px;margin:18px auto;color:var(--muted);font-size:17px;line-height:1.7}
button{border:1px solid #c8a9ff88;border-radius:999px;padding:13px 20px;background:linear-gradient(135deg,#6b4294,#3c225d);color:white;font:14px Arial,sans-serif;cursor:pointer;transition:transform .2s,background .2s}
button:hover{transform:translateY(-2px);background:linear-gradient(135deg,#8057ad,#4c2b70)}
.card{background:linear-gradient(145deg,#28183aee,#1b1029f2);border:1px solid #c9a8ff30;border-radius:22px;padding:24px;margin:17px 0;box-shadow:0 14px 35px #0003;backdrop-filter:blur(8px)}
.card h2{font-size:25px;font-weight:normal;margin:0 0 12px;color:var(--pink)}
.card p{font-size:16px;line-height:1.85;color:#eee2fa;margin:10px 0}
.center{text-align:center}
.ornament{color:var(--gold);letter-spacing:7px;margin:12px 0}
.counter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0}
.counter div{background:#120a20;border:1px solid #c8a9ff32;border-radius:15px;padding:15px 5px}
.counter strong{display:block;font-size:clamp(25px,7vw,37px);font-weight:normal;color:#f3d6ff}
.counter span{display:block;font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:7px}
.letter{white-space:normal}
.hidden-content{display:none;margin-top:18px;padding:17px;border-radius:15px;background:#120a20;border:1px solid #c8a9ff32}
.hidden-content.show{display:block;animation:appear .5s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
input{width:100%;max-width:300px;padding:12px 14px;margin:10px 5px 10px 0;border-radius:12px;border:1px solid #c8a9ff55;background:#120a20;color:white;font-size:16px}
input::placeholder{color:#a995bd}
.song-mark{font-size:36px;margin:4px 0 10px}
footer{text-align:center;color:#bba9d2;font:12px Arial,sans-serif;padding:28px 8px 0;line-height:1.8}
.small{font-size:13px!important;color:#bba9d2!important}
@media(min-width:600px){.card{padding:30px}.hero{padding-top:65px}}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<main>
  <header class="hero">
    <div class="moon">☾ ✦</div>
    <div class="eyebrow">un pequeño universo hecho para ti</div>
    <h1 id="mainTitle">Para Mi negra</h1>
    <p id="introText"></p>
    <button onclick="document.getElementById('carta').scrollIntoView({behavior:'smooth'})">Entra, es para ti ✧</button>
  </header>

  <section class="card center">
    <div class="ornament">✦ ───── ♡ ───── ✦</div>
    <h2 id="counterTitle"></h2>
    <p id="counterIntro"></p>
    <div class="counter" aria-live="polite">
      <div><strong id="days">—</strong><span>días</span></div>
      <div><strong id="hours">—</strong><span>horas</span></div>
      <div><strong id="minutes">—</strong><span>minutos</span></div>
    </div>
    <p class="small" id="counterFooter"></p>
  </section>

  <section class="card" id="carta">
    <div class="ornament">♡</div>
    <h2 id="letterTitle"></h2>
    <div class="letter" id="letterText"></div>
  </section>

  <section class="card center">
    <div class="song-mark">🎶</div>
    <h2 id="songTitle"></h2>
    <p id="songText"></p>
    <p class="small" id="songNote"></p>
  </section>

  <section class="card center">
    <div class="ornament">✧ ✧ ✧</div>
    <h2 id="secretTitle"></h2>
    <p id="secretIntro"></p>
    <input id="secretWord" type="password" placeholder="Escribe la palabra secreta" autocomplete="off" aria-label="Palabra secreta">
    <br><button onclick="unlockSecret()">Abrir mi sorpresa 💌</button>
    <div id="secretMessage" class="hidden-content">
      <div id="secretText"></div>
    </div>
    <p id="wrongWord" class="small" role="status"></p>
  </section>

  <section class="card center">
    <h2 id="finalTitle"></h2>
    <p id="finalIntro"></p>
    <button id="finalButton" onclick="showFinal()"></button>
    <div id="finalMessage" class="hidden-content">
      <div id="finalText"></div>
    </div>
  </section>

  <footer>
    <span id="footerText"></span><br>
    <span>☾ ✦ ♡ ✦ ☽</span>
  </footer>
</main>
<script>
/* =========================================================
   💜 PERSONALIZA TUS PALABRAS AQUÍ
   Cambia solo el texto entre comillas. Conserva las comas.
   Para escribir varias líneas de carta, separa los párrafos
   con <p>...</p> como en el ejemplo de abajo.
   ========================================================= */
const PERSONALIZACION = {
  apodo: "Mi negra",
  fechaConocieron: "7 de agosto de 2026",
  fechaInicio: [2026, 7, 7], // año, mes (enero=0), día
  palabraSecreta: "lolo",
  tituloPestana: "Para Mi negra 💜",
  tituloPrincipal: "Para Mi negra",
  introduccion: "Si pudiera regalarte un lugar donde siempre te sintieras querida, sería este rinconcito. Y como no puedo meter el universo en una cajita… hice una página para ti. 💜",
  tituloContador: "Nuestro pequeño comienzo",
  textoContador: 'Desde aquel día, el <strong>7 de agosto de 2026</strong>, empezó a escribirse una parte bonita de mi historia.',
  pieContador: "Y todavía quedan muchos momentos bonitos por vivir. 💫",
  tituloCarta: "Una carta para ti",
  carta: `<p>Mi negra,</p>
<p>No sé si una página pueda demostrar todo el cariño que te tengo, pero quería hacer algo que fuera tuyo, algo que pudieras abrir cualquier día y que te recordara lo importante que eres para mí.</p>
<p>Me gusta saber que existes, que entre tantas personas nuestros caminos se cruzaron y que puedo compartir contigo pedacitos de mis días. A veces quisiera encontrar las palabras perfectas para explicarte lo que me haces sentir, pero creo que ni las más bonitas alcanzarían.</p>
<p>Quiero que sonrías mucho, que nunca dudes de lo valiosa que eres y que, incluso en esos días en que todo parezca pesado, recuerdes que mereces cariño del bonito: del que escucha, respeta, acompaña y te deja ser tú misma.</p>
<p>No hice esto porque sea una fecha especial. Lo hice porque tú eres especial para mí, y me nació regalarte un detalle que llevara un poquito de lo que siento.</p>
<p>Gracias por ser tú, Mi negra. Ojalá esta página te saque esa sonrisita tuya que me encanta imaginar. Y si algún día vuelves a abrirla, quiero que encuentres aquí un recordatorio: eres alguien muy querida. 💜</p>
<p>Con muchísimo cariño,<br><strong>alguien que se alegra de tenerte en su vida. ♡</strong></p>`,
  tituloCancion: "Mi Santa",
  textoCancion: 'Hay canciones que parecen guardar sentimientos que uno no sabe explicar. Elegí <em>“Mi Santa”</em>, de Romeo Santos, porque quería que esta parte de mi regalo tuviera un sonido especial y que, cuando la escuches, te acuerdes un poquito de mí.',
  notaCancion: "Puedes poner la canción desde tu plataforma de música favorita. Esta página no reproduce audio automáticamente.",
  tituloSorpresa: "Una pequeña sorpresa",
  introSorpresa: "Hay una puertita escondida en este rincón. Si conoces la palabra, puedes abrirla. 🤫",
  textoSorpresa: `<h2>Un secreto para ti ♡</h2>
<p>Mi negra, si llegaste hasta aquí, quiero que te quedes con esto: no tienes que hacer nada extraordinario para merecer cariño. Me alegra conocerte tal como eres, con tus ocurrencias, tus días buenos y los no tan buenos.</p>
<p>Y si pudiera pedirle un deseo a esta noche, sería que la vida te regale motivos para sonreír y personas que te cuiden con la misma ternura que tú mereces. Ojalá este pequeño detalle sea uno de esos motivos. 💜</p>`,
  tituloFinal: "Antes de que te vayas…",
  introFinal: "Respira un poquito, sonríe si te nace y recuerda que alguien se tomó el tiempo de hacer todo esto pensando en ti.",
  botonFinal: "Tengo una última cosita ✨",
  textoFinal: `<p>Si pudiera ponerle un nombre a este regalo, sería “un pedacito de mi cariño para ti”. No es perfecto, pero está hecho con intención bonita. Espero que hoy, mañana o cualquier día que vuelvas, te haga sentir especial.</p>
<p><strong>Te mando un abrazo enorme, Mi negra. 💜🌙</strong></p>`,
  piePagina: "Hecho con cariño, especialmente para Mi negra"
};

function aplicarPersonalizacion() {
  const t = PERSONALIZACION;
  document.title = t.tituloPestana;
  document.getElementById('mainTitle').textContent = t.tituloPrincipal;
  document.getElementById('introText').textContent = t.introduccion;
  document.getElementById('counterTitle').textContent = t.tituloContador;
  document.getElementById('counterIntro').innerHTML = t.textoContador;
  document.getElementById('counterFooter').textContent = t.pieContador;
  document.getElementById('letterTitle').textContent = t.tituloCarta;
  document.getElementById('letterText').innerHTML = t.carta;
  document.getElementById('songTitle').textContent = t.tituloCancion;
  document.getElementById('songText').innerHTML = t.textoCancion;
  document.getElementById('songNote').textContent = t.notaCancion;
  document.getElementById('secretTitle').textContent = t.tituloSorpresa;
  document.getElementById('secretIntro').textContent = t.introSorpresa;
  document.getElementById('secretText').innerHTML = t.textoSorpresa;
  document.getElementById('finalTitle').textContent = t.tituloFinal;
  document.getElementById('finalIntro').textContent = t.introFinal;
  document.getElementById('finalButton').textContent = t.botonFinal;
  document.getElementById('finalText').innerHTML = t.textoFinal;
  document.getElementById('footerText').textContent = t.piePagina;
}
aplicarPersonalizacion();

const starField = document.getElementById('stars');
for (let i = 0; i < 65; i++) {
  const s = document.createElement('span');
  s.className = 'star';
  s.textContent = i % 5 === 0 ? '✦' : '·';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.fontSize = (8 + Math.random() * 13) + 'px';
  s.style.animationDelay = (Math.random() * 4) + 's';
  starField.appendChild(s);
}
function updateCounter() {
  // Fecha de inicio local: 7 de agosto de 2026.
  const start = new Date(PERSONALIZACION.fechaInicio[0], PERSONALIZACION.fechaInicio[1], PERSONALIZACION.fechaInicio[2], 0, 0, 0);
  const now = new Date();
  let diff = now - start;
  if (diff < 0) {
    document.getElementById('days').textContent = '0';
    document.getElementById('hours').textContent = '0';
    document.getElementById('minutes').textContent = '0';
    return;
  }
  const totalMinutes = Math.floor(diff / 60000);
  document.getElementById('days').textContent = Math.floor(totalMinutes / 1440);
  document.getElementById('hours').textContent = Math.floor((totalMinutes % 1440) / 60);
  document.getElementById('minutes').textContent = totalMinutes % 60;
}
updateCounter();
setInterval(updateCounter, 60000);
function unlockSecret() {
  const word = document.getElementById('secretWord').value.trim().toLocaleLowerCase('es');
  const message = document.getElementById('secretMessage');
  const feedback = document.getElementById('wrongWord');
  if (word === PERSONALIZACION.palabraSecreta.trim().toLocaleLowerCase('es')) {
    message.classList.add('show');
    feedback.textContent = '';
  } else {
    feedback.textContent = 'Mmm… esa no es la palabra. Inténtalo otra vez, tú puedes. ♡';
  }
}
function showFinal() {
  document.getElementById('finalMessage').classList.toggle('show');
}
document.getElementById('secretWord').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlockSecret();
});
</script>
</body>
</html>
